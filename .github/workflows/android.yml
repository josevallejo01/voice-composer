name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Uses its own Gradle, so the build does not depend on the wrapper script's
      # executable bit (lost when files are uploaded through the GitHub web UI).
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: voice-composer-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Unit tests (music model, engine, exporters). They do not block the APK.
      - name: Unit tests
        continue-on-error: true
        run: gradle :core:music-model:test :engine:test :data:export:test --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
          if-no-files-found: ignore
