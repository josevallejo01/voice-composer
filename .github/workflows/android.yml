name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Uses its own Gradle, so the build does not depend on the wrapper script's
      # executable bit (lost when files are uploaded through the GitHub web UI).
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      # Convenience for uploads from a phone: GitHub does not unzip files, so if the repository only
      # contains voice-composer.zip (or any .zip with the project), unpack it here.
      - name: Unpack project zip if needed
        run: |
          if [ -z "$(find . -maxdepth 3 \( -name settings.gradle.kts -o -name settings.gradle \) -not -path './.git/*' | head -1)" ]; then
            for z in ./*.zip; do
              [ -e "$z" ] || continue
              echo "Unpacking $z"
              unzip -q -o "$z" -d ./unpacked
            done
          fi

      # The Gradle project is wherever settings.gradle(.kts) is: the repository root, or a sub-folder
      # when the project folder itself was uploaded instead of its content.
      - name: Locate the Gradle project
        id: root
        run: |
          f=$(find . -maxdepth 3 \( -name settings.gradle.kts -o -name settings.gradle \) -not -path './.git/*' | head -1)
          if [ -z "$f" ]; then
            echo "::error::No settings.gradle.kts found. Files in the repository:"
            find . -maxdepth 3 -not -path './.git/*' | head -50
            exit 1
          fi
          dir=$(dirname "$f")
          echo "Gradle project found in: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle -p "${{ steps.root.outputs.dir }}" assembleDebug --continue --console=plain --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"

      # On failure: show only the useful part (compiler errors) on the run's Summary page,
      # which is much easier to read and copy than the full log, and keep the full log as an artifact.
      - name: Summarize build errors
        if: failure()
        shell: bash
        run: |
          {
            echo "## Build errors"
            echo '```'
            grep -E "^e: " "$RUNNER_TEMP/build.log" | sed 's#file://[^ ]*/unpacked/##; s#file://[^ ]*/work/[^/]*/[^/]*/##' | sort -u | head -150
            echo '```'
            echo "## What went wrong"
            echo '```'
            grep -A12 "What went wrong" "$RUNNER_TEMP/build.log" | head -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: voice-composer-debug-apk
          path: ${{ steps.root.outputs.dir }}/app/build/outputs/apk/debug/*.apk

      # Unit tests (music model, engine, exporters). They do not block the APK.
      - name: Unit tests
        continue-on-error: true
        run: gradle -p "${{ steps.root.outputs.dir }}" :core:music-model:test :engine:test :data:export:test --stacktrace

      - name: Upload test reports
        if: always() && steps.root.outputs.dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            ${{ steps.root.outputs.dir }}/**/build/reports/tests/
          if-no-files-found: ignore
